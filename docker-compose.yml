version: '3.7'

services:
  moodle_38_db:
    image: mariadb
    restart: always
    container_name : moodle_38_db
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_bin
      --innodb_file_format=barracuda
      --innodb_file_per_table=On
      --innodb_large_prefix=On
    volumes:
      - 'qisat_moodle38:/var/lib/mysql:rw'
    ports:
      - "${DB_HOST_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

  moodle_38_www:
    build:  "./"
    restart: always
    container_name : moodle_38_www
    volumes:
      - '${PATH_HOST_MOODLE_DATA}:/var/www/moodledata:rw'
      - '${PATH_HOST_WWW_MOODLE}:/var/www/html/moodle:rw'
    ports:
      - '${WWW_HOST_PORT}:80'
      - '${SSL_HOST_PORT}:443'
    links:
      - moodle_38_db
    environment:
      MOODLE_URL: ${MOODLE_URL}
      MOODLE_ADMIN: ${MOODLE_ADMIN}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
      MOODLE_DB_TYPE: ${DB_TYPE}
      MOODLE_DB_HOST: ${DB_HOST}
      MOODLE_DB_USER: ${DB_USER}
      MOODLE_DB_PASSWORD: ${DB_PASSWORD}
      MOODLE_DB_NAME: ${DB_NAME}
      MOODLE_DB_LIBRARY: ${DB_LIBRARY}
      MOODLE_DATA_PATH: ${PATH_MOODLE_DATA}
      MOODLE_REVERSE_LB: ${MOODLE_REVERSE_LB}
      MOODLE_SSL: ${MOODLE_SSL}
      MOODLE_EMAIL_TYPE_QMAIL: ${MOODLE_EMAIL_TYPE_QMAIL}
      MOODLE_EMAIL_HOST: ${MOODLE_EMAIL_HOST}
      MOODLE_DOCKER_DBCOLLATION: utf8mb4_bin

volumes: 
  qisat_moodle38: