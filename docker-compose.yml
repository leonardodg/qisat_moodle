version: '3.7'

services:

  moodle_db:
    image: mariadb
    restart: always
    container_name : moodle_db
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_bin
      --innodb_file_format=barracuda
      --innodb_file_per_table=On
      --innodb_large_prefix=On
    volumes:
      - '${PATH_MYSQL_DATA}:/var/lib/mysql'
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MOODLE_DB_NAME}
      MYSQL_USER: ${MOODLE_DB_USER}
      MYSQL_PASSWORD: ${MOODLE_DB_PASSWORD}

  moodle_www:
    build:  "./"
    restart: always
    container_name : moodle_www
    volumes:
      - '${PATH_MOODLE_DATA}:/var/moodledata:rw'
      - '${PATH_MOODLE_WWW}:/var/www/html:rw'
    ports:
      - '${WWW_PORT}:80'
    links:
      - moodle_db
    environment:
      MOODLE_URL: ${MOODLE_URL}
      MOODLE_ADMIN: ${MOODLE_ADMIN}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
      MOODLE_DB_TYPE: "mariadb"
      MOODLE_DB_HOST: "moodle_db"
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_REVERSE_LB: ${MOODLE_REVERSE_LB}
      MOODLE_SSL: ${MOODLE_SSL}
      MOODLE_EMAIL_TYPE_QMAIL: ${MOODLE_EMAIL_TYPE_QMAIL}
      MOODLE_EMAIL_HOST: ${MOODLE_EMAIL_HOST}
      MOODLE_DOCKER_DBCOLLATION: utf8mb4_bin
